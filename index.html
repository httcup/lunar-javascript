<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>农历黄历 · lunar-javascript</title>
<meta name="description" content="基于 lunar-javascript 的农历、黄历、八字、二十四节气查询工具，纯前端、无第三方依赖。">
<style>
  :root{
    --paper:#faf7f2;
    --card:#ffffff;
    --ink:#221d19;
    --ink-soft:#4a423b;
    --muted:#8b8076;
    --line:rgba(34,29,25,.10);
    --line-strong:rgba(34,29,25,.18);
    --red:#b23a2e;
    --red-soft:#f6e9e6;
    --gold:#a9822f;
    --gold-soft:#f7f0df;
    --green:#3d6b52;
    --shadow:0 1px 2px rgba(34,29,25,.04), 0 12px 32px -16px rgba(34,29,25,.18);
    --serif:"Songti SC","Source Han Serif SC","Noto Serif SC",Georgia,serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px}

  /* nav */
  header.nav{position:sticky;top:0;z-index:20;background:rgba(250,247,242,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .nav-in{display:flex;align-items:center;gap:18px;height:58px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:.02em}
  .seal{width:26px;height:26px;border-radius:6px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:14px;font-family:var(--serif);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
  .nav-links{margin-left:auto;display:flex;gap:20px;font-size:13.5px;color:var(--ink-soft)}
  .nav-links a:hover{color:var(--red)}
  @media(max-width:640px){.nav-links{gap:14px}.nav-links .hide-s{display:none}}
  @media(max-width:560px){.nav-links{gap:12px;font-size:12.5px}.nav-links .hide-xs{display:none}.brand span:last-child{font-size:14.5px}}

  /* hero */
  .hero{padding:44px 0 10px}
  .eyebrow{font-size:12.5px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
  h1{font-family:var(--serif);font-size:clamp(26px,4.2vw,38px);line-height:1.25;margin:12px 0 10px;font-weight:600;letter-spacing:.01em}
  .lede{color:var(--ink-soft);max-width:56ch;margin:0}

  /* today card */
  .today{margin:26px 0 0;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
  .today-top{display:grid;grid-template-columns:1.05fr .95fr;gap:0}
  @media(max-width:760px){.today-top{grid-template-columns:1fr}}
  .today-main{padding:26px 28px 24px;border-right:1px solid var(--line)}
  @media(max-width:760px){.today-main{border-right:0;border-bottom:1px solid var(--line)}}
  .solar-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .solar-num{font-family:var(--serif);font-size:44px;line-height:1;font-weight:600}
  .solar-meta{color:var(--muted);font-size:13.5px}
  .lunar-big{font-family:var(--serif);font-size:27px;margin:14px 0 4px;letter-spacing:.04em}
  .tag-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
  .tag{font-size:12.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-soft);background:#fdfcf9}
  .tag.red{color:var(--red);border-color:rgba(178,58,46,.28);background:var(--red-soft)}
  .tag.gold{color:#8a6a1f;border-color:rgba(169,130,47,.3);background:var(--gold-soft)}
  .today-side{padding:24px 26px;display:flex;flex-direction:column;justify-content:center}
  .yiji{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
  .yiji + .yiji{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line-strong)}
  .yi-mark,.ji-mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--serif);font-size:17px;font-weight:600}
  .yi-mark{background:rgba(61,107,82,.10);color:var(--green)}
  .ji-mark{background:var(--red-soft);color:var(--red)}
  .yiji-items{display:flex;flex-wrap:wrap;gap:6px}
  .yiji-items span{font-size:13px;color:var(--ink-soft);background:#f7f4ee;border-radius:6px;padding:2px 8px}

  /* detail grid */
  .grid-detail{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:#fdfcf9}
  @media(max-width:760px){.grid-detail{grid-template-columns:repeat(2,1fr)}}
  .cell{padding:14px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .cell:nth-child(4n){border-right:0}
  @media(max-width:760px){.cell:nth-child(4n){border-right:1px solid var(--line)}.cell:nth-child(2n){border-right:0}}
  .cell .k{font-size:11.5px;letter-spacing:.08em;color:var(--muted)}
  .cell .v{font-size:14px;margin-top:2px;color:var(--ink)}

  /* sections */
  section{padding:46px 0 0}
  .sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
  .sec-head h2{font-family:var(--serif);font-size:20px;font-weight:600;margin:0}
  .sec-head .hint{font-size:12.5px;color:var(--muted)}

  /* converter */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px}
  .modes{display:inline-flex;background:#f2ede5;border-radius:10px;padding:3px;gap:2px}
  .modes button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-size:13px;color:var(--ink-soft);cursor:pointer;font-family:inherit}
  .modes button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(34,29,25,.12)}
  .form{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
  input[type=date],input[type=number],select{
    font-family:inherit;font-size:14px;padding:9px 12px;border-radius:10px;border:1px solid var(--line-strong);
    background:#fff;color:var(--ink);outline:none
  }
  input[type=date]:focus,input[type=number]:focus,select:focus{border-color:rgba(178,58,46,.5);box-shadow:0 0 0 3px rgba(178,58,46,.08)}
  .btn{font-family:inherit;font-size:14px;padding:9px 18px;border-radius:10px;border:1px solid var(--red);background:var(--red);color:#fff;cursor:pointer}
  .btn:hover{background:#9d3227}
  .btn.ghost{background:#fff;color:var(--ink-soft);border-color:var(--line-strong)}
  .lunar-form{display:none;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px}
  .lunar-form.on{display:flex}
  .chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft)}

  .result{margin-top:20px;display:none}
  .result.on{display:block}
  .pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:640px){.pillars{grid-template-columns:repeat(2,1fr)}}
  .pillar{border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;background:#fdfcf9}
  .pillar .lbl{font-size:11.5px;letter-spacing:.1em;color:var(--muted)}
  .pillar .gz{font-family:var(--serif);font-size:26px;letter-spacing:.06em;margin-top:6px}
  .pillar .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
  @media(max-width:640px){.kv{grid-template-columns:repeat(2,1fr)}}
  .kv .item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
  .kv .item .k{font-size:11.5px;color:var(--muted);letter-spacing:.06em}
  .kv .item .v{font-size:14px;margin-top:3px}
  .full-line{margin-top:12px;font-size:13px;color:var(--ink-soft);border:1px dashed var(--line-strong);border-radius:12px;padding:12px 14px;background:#fdfcf9;word-break:break-all}

  /* jieqi */
  .jieqi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  @media(max-width:860px){.jieqi-grid{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:560px){.jieqi-grid{grid-template-columns:repeat(3,1fr)}}
  .jq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;transition:.18s}
  .jq:hover{border-color:var(--line-strong);transform:translateY(-1px)}
  .jq .n{font-family:var(--serif);font-size:16px}
  .jq .d{font-size:11.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
  .jq.past{opacity:.45}
  .jq.now{border-color:rgba(178,58,46,.45);background:var(--red-soft)}
  .jq.now .n{color:var(--red)}

  footer{margin-top:56px;border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:12.5px}
  footer .frow{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
  footer a{border-bottom:1px solid var(--line-strong)}
  footer a:hover{color:var(--red);border-color:var(--red)}
  .mono{font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="#top"><span class="seal">历</span><span>农历黄历</span></a>
    <nav class="nav-links">
      <a class="hide-xs" href="#today">今日</a>
      <a href="#convert">日期查询</a>
      <a href="#jieqi">二十四节气</a>
      <a class="hide-s" href="https://github.com/httcup/lunar-javascript" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </div>
</header>

<main class="wrap" id="top">
  <section class="hero" style="padding-top:40px">
    <div class="eyebrow">lunar · 公历 · 农历 · 黄历</div>
    <h1>一个页面看完整天干地支</h1>
    <p class="lede">纯前端农历与黄历工具，支持公历农历互转、四柱八字、二十四节气、宜忌冲煞。数据来自 <a href="https://github.com/httcup/lunar-javascript" style="border-bottom:1px solid var(--line-strong)">lunar-javascript</a>，无第三方依赖。</p>
  </section>

  <section id="today" style="padding-top:26px">
    <div class="today">
      <div class="today-top">
        <div class="today-main">
          <div class="solar-line">
            <span class="solar-num mono" id="t-day">--</span>
            <span class="solar-meta" id="t-solarmeta">--</span>
          </div>
          <div class="lunar-big" id="t-lunar">--</div>
          <div class="tag-row" id="t-tags"></div>
        </div>
        <div class="today-side">
          <div class="yiji">
            <div class="yi-mark">宜</div>
            <div class="yiji-items" id="t-yi"></div>
          </div>
          <div class="yiji">
            <div class="ji-mark">忌</div>
            <div class="yiji-items" id="t-ji"></div>
          </div>
        </div>
      </div>
      <div class="grid-detail" id="t-detail"></div>
    </div>
  </section>

  <section id="convert">
    <div class="sec-head">
      <h2>日期查询</h2>
      <span class="hint">公历 ↔ 农历，查四柱、节气、星宿、纳音</span>
    </div>
    <div class="panel">
      <div class="modes" role="tablist">
        <button class="on" data-mode="s2l">公历 → 农历</button>
        <button data-mode="l2s">农历 → 公历</button>
      </div>

      <div class="form" id="form-s2l">
        <input type="date" id="in-date">
        <button class="btn" id="btn-s2l">查询</button>
        <button class="btn ghost" data-quick="today">今天</button>
      </div>

      <div class="lunar-form" id="form-l2s">
        <input type="number" id="in-y" placeholder="年" style="width:96px">
        <input type="number" id="in-m" placeholder="月" style="width:80px">
        <input type="number" id="in-d" placeholder="日" style="width:80px">
        <label class="chk"><input type="checkbox" id="in-leap"> 闰月</label>
        <button class="btn" id="btn-l2s">查询</button>
      </div>

      <div class="result" id="result">
        <div class="pillars" id="r-pillars"></div>
        <div class="kv" id="r-kv"></div>
        <div class="full-line" id="r-full"></div>
      </div>
    </div>
  </section>

  <section id="jieqi">
    <div class="sec-head">
      <h2>二十四节气</h2>
      <span class="hint" id="jq-hint"></span>
    </div>
    <div class="jieqi-grid" id="jq-grid"></div>
  </section>

  <footer>
    <div class="frow">
      <span>数据与算法：<a href="https://github.com/6tail/lunar-javascript" target="_blank" rel="noopener">6tail/lunar-javascript</a> · MIT</span>
      <span>本站仓库：<a href="https://github.com/httcup/lunar-javascript" target="_blank" rel="noopener">httcup/lunar-javascript</a></span>
      <span id="f-time" class="mono"></span>
    </div>
  </footer>
</main>

<script src="lunar.js"></script>
<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var pad = function(n){ return n < 10 ? '0' + n : '' + n; };
  var JQ_NAMES = ['小寒','大寒','立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种','夏至','小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至'];

  function solarOfToday(){
    var n = new Date();
    return Solar.fromYmd(n.getFullYear(), n.getMonth() + 1, n.getDate());
  }

  /* ---------- 今日黄历 ---------- */
  function renderToday(){
    var s = solarOfToday();
    var l = s.getLunar();

    $('t-day').textContent = pad(s.getDay());
    $('t-solarmeta').textContent = s.getYear() + ' 年 ' + s.getMonth() + ' 月 · 星期' + s.getWeekInChinese() + ' · ' + s.getXingZuo() + '座';

    $('t-lunar').textContent = l.getYearInChinese() + '年 ' + l.getMonthInChinese() + '月' + l.getDayInChinese();

    var tags = [];
    tags.push([l.getYearInGanZhi() + '年 · ' + l.getYearShengXiao() + '年', 'gold']);
    tags.push([l.getMonthInGanZhi() + '月 · ' + l.getDayInGanZhi() + '日', '']);
    var jq = l.getJieQi();
    if (jq) tags.push(['今日 ' + jq, 'red']);
    tags.push(['纳音 ' + l.getDayNaYin(), '']);
    if (l.getFestivals().length) tags.push([l.getFestivals().join(' · '), 'red']);
    $('t-tags').innerHTML = tags.map(function(t){
      return '<span class="tag ' + t[1] + '">' + t[0] + '</span>';
    }).join('');

    var yi = l.getDayYi(); var ji = l.getDayJi();
    $('t-yi').innerHTML = (yi.length ? yi : ['诸事不宜']).slice(0, 10).map(function(x){ return '<span>' + x + '</span>'; }).join('');
    $('t-ji').innerHTML = (ji.length ? ji : ['无']).slice(0, 10).map(function(x){ return '<span>' + x + '</span>'; }).join('');

    var prev = l.getPrevJieQi(true), next = l.getNextJieQi(true);
    var cells = [
      ['冲煞', l.getChongDesc() + ' 煞' + l.getSha()],
      ['值神', l.getDayTianShen() + '（' + l.getDayTianShenType() + '）'],
      ['建除', l.getZhiXing() + '日'],
      ['星宿', l.getXiu() + '宿 · ' + l.getZheng() + l.getAnimal()],
      ['胎神', l.getDayPositionTai()],
      ['月相', l.getYueXiang()],
      ['喜神', l.getDayPositionXiDesc()],
      ['福神', l.getDayPositionFuDesc()],
      ['财神', l.getDayPositionCaiDesc()],
      ['阳贵神', l.getDayPositionYangGuiDesc()],
      ['上一节气', prev.getName() + ' ' + prev.getSolar().toYmd().slice(5)],
      ['下一节气', next.getName() + ' ' + next.getSolar().toYmd().slice(5)]
    ];
    $('t-detail').innerHTML = cells.map(function(c){
      return '<div class="cell"><div class="k">' + c[0] + '</div><div class="v">' + c[1] + '</div></div>';
    }).join('');
  }

  /* ---------- 查询结果 ---------- */
  function renderResult(solar){
    var l = solar.getLunar();
    var ec = l.getEightChar();

    var cols = [
      ['年柱', ec.getYear(), l.getYearShengXiao() + '年'],
      ['月柱', ec.getMonth(), '节气月'],
      ['日柱', ec.getDay(), l.getDayNaYin()],
      ['时柱', ec.getTime(), '时辰']
    ];
    $('r-pillars').innerHTML = cols.map(function(c){
      return '<div class="pillar"><div class="lbl">' + c[0] + '</div><div class="gz">' + c[1] + '</div><div class="sub">' + c[2] + '</div></div>';
    }).join('');

    var jq = l.getJieQi();
    var prev = l.getPrevJieQi(true), next = l.getNextJieQi(true);
    var fest = l.getFestivals().concat(l.getOtherFestivals());
    var kv = [
      ['公历', solar.toYmd() + ' 星期' + solar.getWeekInChinese()],
      ['农历', l.getYearInChinese() + '年' + l.getMonthInChinese() + '月' + l.getDayInChinese()],
      ['生肖 / 星座', l.getYearShengXiao() + ' / ' + solar.getXingZuo() + '座'],
      ['节气', jq ? ('当日 ' + jq) : (prev.getName() + ' 后 ' + dayDiff(prev.getSolar(), solar) + ' 天')],
      ['下一节气', next.getName() + ' · ' + next.getSolar().toYmd() + ' ' + next.getSolar().toYmdHms().slice(11, 16)],
      ['日纳音', l.getDayNaYin()],
      ['星宿 / 值神', l.getXiu() + '宿 / ' + l.getDayTianShen()],
      ['冲煞', l.getChongDesc() + ' 煞' + l.getSha()],
      ['节日', fest.length ? fest.join('、') : '无']
    ];
    $('r-kv').innerHTML = kv.map(function(c){
      return '<div class="item"><div class="k">' + c[0] + '</div><div class="v">' + c[1] + '</div></div>';
    }).join('');

    $('r-full').textContent = l.toFullString();
    $('result').classList.add('on');
  }

  function dayDiff(a, b){
    var d1 = Date.UTC(a.getYear(), a.getMonth() - 1, a.getDay());
    var d2 = Date.UTC(b.getYear(), b.getMonth() - 1, b.getDay());
    return Math.round((d2 - d1) / 86400000);
  }

  /* ---------- 二十四节气 ---------- */
  function renderJieQi(year){
    var table = Solar.fromYmd(year, 6, 1).getLunar().getJieQiTable();
    var today = solarOfToday();
    var todayKey = today.toYmd();
    var nowIdx = -1;

    var html = JQ_NAMES.map(function(name, i){
      var s = table[name];
      if (!s) return '';
      var d = s.toYmd();
      var cls = '';
      if (d === todayKey) { cls = 'now'; nowIdx = i; }
      else if (d < todayKey) { cls = 'past'; }
      return '<div class="jq ' + cls + '"><div class="n">' + name + '</div><div class="d mono">' + d.slice(5).replace('-', '/') + ' ' + s.toYmdHms().slice(11, 16) + '</div></div>';
    }).join('');

    $('jq-grid').innerHTML = html;
    var cur = nowIdx >= 0 ? JQ_NAMES[nowIdx] : (function(){
      // 找最近的已过节气
      var name = '';
      JQ_NAMES.forEach(function(n){ if (table[n] && table[n].toYmd() <= todayKey) name = n; });
      return name;
    })();
    $('jq-hint').textContent = year + ' 年 · 当前节气：' + (cur || '—');
  }

  /* ---------- 交互 ---------- */
  function setMode(mode){
    var btns = document.querySelectorAll('.modes button');
    for (var i = 0; i < btns.length; i++){
      btns[i].classList.toggle('on', btns[i].getAttribute('data-mode') === mode);
    }
    $('form-s2l').style.display = mode === 's2l' ? 'flex' : 'none';
    $('form-l2s').classList.toggle('on', mode === 'l2s');
  }

  document.querySelectorAll('.modes button').forEach(function(b){
    b.addEventListener('click', function(){ setMode(b.getAttribute('data-mode')); });
  });

  var todaySolar = solarOfToday();
  $('in-date').value = todaySolar.toYmd();

  $('btn-s2l').addEventListener('click', function(){
    var v = $('in-date').value;
    if (!v) return;
    var p = v.split('-');
    renderResult(Solar.fromYmd(parseInt(p[0], 10), parseInt(p[1], 10), parseInt(p[2], 10)));
  });

  document.querySelectorAll('[data-quick]').forEach(function(b){
    b.addEventListener('click', function(){
      $('in-date').value = todaySolar.toYmd();
      renderResult(todaySolar);
    });
  });

  $('btn-l2s').addEventListener('click', function(){
    var y = parseInt($('in-y').value, 10), m = parseInt($('in-m').value, 10), d = parseInt($('in-d').value, 10);
    if (!y || !m || !d) return;
    try {
      var lunar = Lunar.fromYmd(y, $('in-leap').checked ? -m : m, d);
      renderResult(lunar.getSolar());
    } catch (e) {
      $('r-full').textContent = '该农历日期不存在，请检查年月日或闰月标记。';
      $('result').classList.add('on');
    }
  });

  /* ---------- 初始化 ---------- */
  renderToday();

})();
